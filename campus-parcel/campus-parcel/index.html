<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Parcel Management</title>
  <script>
    try {
      var raw = sessionStorage.getItem("campusSession");
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && sess.role) {
          window.location.replace("HTML/" + sess.role + ".html");
        } else {
          window.location.replace("HTML/login.html");
        }
      } else {
        window.location.replace("HTML/login.html");
      }
    } catch (e) {
      window.location.replace("HTML/login.html");
    }
  </script>
</head>
<body>
  <p>Redirecting to Campus Parcel Management... If not redirected, <a href="HTML/login.html">click here to log in</a>.</p>
</body>
</html>
